<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Young Revivalist Academy | Sign In</title>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Shared CSS -->
    <link rel="stylesheet" href="login.css">

    <!-- Supabase JS Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Shared JS -->
    <script src="auth.js" defer></script>
</head>
<body>

    <canvas id="particleCanvas"></canvas>

    <div class="auth-wrapper">
        <header class="auth-header">
            <a href="index.html" class="logo">YOUNG <span>REVIVALIST</span> ACADEMY</a>
            <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Home</a>
        </header>

        <main class="auth-container">
            <div class="orb-container">
                <div class="glass-orb auth-card">
                    
                    <div id="status-message" class="status-msg"></div>

                    <!-- SIGN IN FORM -->
                    <form id="login-form" class="auth-form">
                        <div class="form-header">
                            <h2>Welcome Back</h2>
                            <p>Enter your credentials to access YRA</p>
                        </div>

                        <div class="input-group">
                            <i class="fas fa-envelope input-icon"></i>
                            <input type="email" id="login-email" placeholder="Email Address" required autocomplete="email">
                        </div>

                        <div class="input-group">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="login-password" placeholder="Password" required autocomplete="current-password">
                        </div>

                        <button type="submit" id="login-btn" class="auth-submit-btn">
                            <span>ENTER PORTAL</span>
                            <i class="fas fa-arrow-right"></i>
                        </button>
                    </form>

                    <!-- DIRECT LINK TO SIGN UP PAGE -->
                    <div class="account-switch-container">
                        <span>Don't have an account yet?</span>
                        <a href="signup.html" class="switch-link-btn">CREATE AN ACCOUNT</a>
                    </div>

                    <!-- ADMIN PORTAL DIRECTIVE -->
                    <div class="admin-directive">
                        <span>FACULTY & ADMINISTRATION</span>
                        <a href="admin/dashboard.html">
                            <i class="fas fa-user-shield"></i>
                            ADMINISTRATOR PORTAL
                        </a>
                    </div>

                </div>
            </div>
        </main>
    </div>

</body>
</html>
