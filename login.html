<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Young Revivalist Academy | Portal Access</title>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- External CSS -->
    <link rel="stylesheet" href="login.css">

    <!-- Supabase JS Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- External JS -->
    <script src="auth.js" defer></script>
</head>
<body>

    <canvas id="particleCanvas"></canvas>

    <div class="auth-wrapper">
        <header class="auth-header">
            <a href="index.html" class="logo">YOUNG <span>REVIVALIST</span> ACADEMY</a>
            <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Home</a>
        </header>

        <main class="auth-container">
            <div class="orb-container">
                <div class="glass-orb auth-card">
                    
                    <div class="auth-toggle">
                        <button id="toggle-login" class="toggle-btn active" type="button">Sign In</button>
                        <button id="toggle-register" class="toggle-btn" type="button">Sign Up</button>
                    </div>

                    <div id="status-message" class="status-msg"></div>

                    <!-- 1. SIGN IN FORM -->
                    <form id="login-form" class="auth-form active">
                        <div class="form-header">
                            <h2>Welcome Back</h2>
                            <p>Enter your credentials to access YRA</p>
                        </div>

                        <div class="input-group">
                            <i class="fas fa-envelope input-icon"></i>
                            <input type="email" id="login-email" placeholder="Email Address" required autocomplete="email">
                        </div>

                        <div class="input-group">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="login-password" placeholder="Password" required autocomplete="current-password">
                        </div>

                        <button type="submit" id="login-btn" class="auth-submit-btn">
                            <span>ENTER PORTAL</span>
                            <i class="fas fa-arrow-right"></i>
                        </button>
                    </form>

                    <!-- 2. SIGN UP FORM -->
                    <form id="register-form" class="auth-form">
                        <div class="form-header">
                            <h2>Join the Movement</h2>
                            <p>Apply for admission to Young Revivalist Academy</p>
                        </div>

                        <div class="input-group">
                            <i class="fas fa-user input-icon"></i>
                            <input type="text" id="reg-fullname" placeholder="Full Name" required>
                        </div>

                        <div class="input-group">
                            <i class="fas fa-envelope input-icon"></i>
                            <input type="email" id="reg-email" placeholder="Email Address" required autocomplete="email">
                        </div>

                        <div class="input-group">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="reg-password" placeholder="Password (min. 6 chars)" required autocomplete="new-password">
                        </div>

                        <button type="submit" id="register-btn" class="auth-submit-btn">
                            <span>SUBMIT APPLICATION</span>
                            <i class="fas fa-arrow-right"></i>
                        </button>
                    </form>

                    <!-- 3. ADMIN PORTAL DIRECTIVE -->
                    <div class="admin-directive">
                        <span>FACULTY & ADMINISTRATION</span>
                        <a href="admin/dashboard.html">
                            <i class="fas fa-user-shield"></i>
                            ADMINISTRATOR PORTAL
                        </a>
                    </div>

                </div>
            </div>
        </main>
    </div>

</body>
</html>
