<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>YRA | Portal Access</title>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Favicon -->
    <link rel="icon" href="favicon.png" type="image/png">
</head>
<body>
    <!-- Particle Canvas background matching landing page -->
    <canvas id="particleCanvas"></canvas>

    <div class="auth-wrapper">
        <header class="auth-header">
            <a href="index.html" class="logo">YOUNG <span>REVIVALIST</span> ACADEMY</a>
            <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Home</a>
        </header>

        <main class="auth-container">
            <div class="orb-container">
                <div class="glass-orb auth-card">
                    <!-- Dynamic Auth Toggle -->
                    <div class="auth-toggle">
                        <button id="toggle-login" class="toggle-btn active">Sign In</button>
                        <button id="toggle-register" class="toggle-btn">Sign Up</button>
                    </div>

                    <!-- 1. SIGN IN FORM -->
                    <form id="login-form" class="auth-form active">
                        <div class="form-header">
                            <h2>Welcome Back</h2>
                            <p>Enter your credentials to access the Portal</p>
                        </div>

                        <div class="input-group">
                            <i class="fas fa-id-card input-icon"></i>
                            <input type="text" id="login-identifier" placeholder="Email" required autocomplete="username">
                        </div>

                        <div class="input-group">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="login-password" placeholder="Password" required autocomplete="current-password">
                        </div>

                        <button type="submit" class="auth-submit-btn">
                            <span>ENTER PORTAL</span>
                            <i class="fas fa-arrow-right"></i>
                        </button>
                    </form>

                    <!-- 2. SIGN UP FORM -->
                    <form id="register-form" class="auth-form">
                        <div class="form-header">
                            <h2>Join the Movement</h2>
                            <p>Apply for admission to Young Revivalist Academy</p>
                        </div>

                        <div class="input-group">
                            <i class="fas fa-user input-icon"></i>
                            <input type="text" id="reg-fullname" placeholder="Full Name" required>
                        </div>

                        <div class="input-group">
                            <i class="fas fa-envelope input-icon"></i>
                            <input type="email" id="reg-email" placeholder="Email Address" required autocomplete="email">
                        </div>

                        <div class="input-group">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="reg-password" placeholder="Password (min. 6 chars)" required autocomplete="new-password">
                        </div>

                        <button type="submit" class="auth-submit-btn">
                            <span>SUBMIT APPLICATION</span>
                            <i class="fas fa-arrow-right"></i>
                        </button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/auth.js"></script>
</body>
</html>
