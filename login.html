<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login | Young Revivalist Academy</title>

    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="icon" href="favicon.png" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="favicon.png">
</head>
<body>
    <canvas id="particleCanvas"></canvas>

    <div class="login-wrapper">
        <a href="index.html" class="back-link">
            <i class="fas fa-arrow-left"></i>
            <span>BACK</span>
        </a>

        <div class="login-panel">
            <div class="login-header">
                <div class="logo">YOUNG <span>REVIVALIST</span> ACADEMY</div>
                <h1>Welcome<br>Back.</h1>
                <p>Sign in to continue your journey.</p>
            </div>

            <form id="loginForm" class="login-form" novalidate>
                <div class="input-group">
                    <label for="email">EMAIL</label>
                    <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
                    <span class="input-line"></span>
                    <span class="error-msg" id="emailError"></span>
                </div>

                <div class="input-group">
                    <label for="password">PASSWORD</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••••">
                    <span class="input-line"></span>
                    <span class="error-msg" id="passwordError"></span>
                </div>

                <div class="form-footer">
                    <span class="general-error" id="formError"></span>
                    <button type="submit" class="signin-btn" id="signinBtn">
                        <span class="btn-text">SIGN IN</span>
                        <span class="btn-loader"></span>
                    </button>
                </div>
            </form>

            <div class="divider">
                <span>OR</span>
            </div>

            <a href="admin-login.html" class="admin-link">
                <i class="fas fa-shield-halved"></i>
                <span>Administrator Login</span>
            </a>
        </div>
    </div>

    <!-- Supabase SDK must load first, then the shared client, then this page's logic -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="login.js"></script>
</body>
</html>
