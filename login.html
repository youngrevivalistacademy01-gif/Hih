<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Young Revivalist Academy | Portal Access</title>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Supabase JS Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary-orange: #ff6b3d;
            --orange-glow: rgba(255, 107, 61, 0.4);
            --bg-dark: #0a0a0a;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-muted: #888888;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            overflow-x: hidden;
            min-height: 100vh;
        }

        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .auth-wrapper {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            perspective: 1000px;
        }

        .auth-header {
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-weight: 900;
            font-size: 14px;
            letter-spacing: 2px;
            color: #ffffff;
            text-decoration: none;
        }

        .logo span { color: var(--primary-orange); }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }

        .back-link:hover { color: #ffffff; }

        .auth-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .orb-container {
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
        }

        .auth-card {
            width: 380px;
            min-height: 520px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 35px 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
        }

        .auth-toggle {
            display: flex;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 50px;
            padding: 4px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .toggle-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px 0;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .toggle-btn.active {
            background: var(--primary-orange);
            color: #ffffff;
            box-shadow: 0 0 15px var(--orange-glow);
        }

        .auth-form {
            display: none;
            flex-direction: column;
            gap: 18px;
            animation: fadeIn 0.4s ease forwards;
        }

        .auth-form.active { display: flex; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-header h2 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .form-header p {
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-bottom: 10px;
        }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 14px 14px 14px 45px;
            color: #ffffff;
            font-size: 13px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: var(--primary-orange);
            box-shadow: 0 0 10px rgba(255, 107, 61, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }

        .auth-submit-btn {
            margin-top: 10px;
            background: var(--primary-orange);
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 0 20px var(--orange-glow);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .auth-submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(255, 107, 61, 0.6);
        }

        /* Status Feedback Message */
        .status-msg {
            display: none;
            padding: 10px;
            border-radius: 10px;
            font-size: 12px;
            text-align: center;
            margin-top: 10px;
        }
        .status-msg.error { background: rgba(255, 0, 0, 0.2); border: 1px solid red; color: #ff8888; }
        .status-msg.success { background: rgba(0, 255, 0, 0.2); border: 1px solid green; color: #88ff88; }
    </style>
</head>
<body>

    <canvas id="particleCanvas"></canvas>

    <div class="auth-wrapper">
        <header class="auth-header">
            <a href="index.html" class="logo">YOUNG <span>REVIVALIST</span> ACADEMY</a>
            <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Home</a>
        </header>

        <main class="auth-container">
            <div class="orb-container">
                <div class="glass-orb auth-card">
                    
                    <div class="auth-toggle">
                        <button id="toggle-login" class="toggle-btn active">Sign In</button>
                        <button id="toggle-register" class="toggle-btn">Sign Up</button>
                    </div>

                    <!-- Alert message container -->
                    <div id="status-message" class="status-msg"></div>

                    <!-- 1. SIGN IN FORM -->
                    <form id="login-form" class="auth-form active">
                        <div class="form-header">
                            <h2>Welcome Back</h2>
                            <p>Enter your credentials to access YRA</p>
                        </div>

                        <div class="input-group">
                            <i class="fas fa-envelope input-icon"></i>
                            <input type="email" id="login-email" placeholder="Email Address" required autocomplete="email">
                        </div>

                        <div class="input-group">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="login-password" placeholder="Password" required autocomplete="current-password">
                        </div>

                        <button type="submit" id="login-btn" class="auth-submit-btn">
                            <span>ENTER PORTAL</span>
                            <i class="fas fa-arrow-right"></i>
                        </button>
                    </form>

                    <!-- 2. SIGN UP FORM -->
                    <form id="register-form" class="auth-form">
                        <div class="form-header">
                            <h2>Join the Movement</h2>
                            <p>Apply for admission to Young Revivalist Academy</p>
                        </div>

                        <div class="input-group">
                            <i class="fas fa-user input-icon"></i>
                            <input type="text" id="reg-fullname" placeholder="Full Name" required>
                        </div>

                        <div class="input-group">
                            <i class="fas fa-envelope input-icon"></i>
                            <input type="email" id="reg-email" placeholder="Email Address" required autocomplete="email">
                        </div>

                        <div class="input-group">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="reg-password" placeholder="Password (min. 6 chars)" required autocomplete="new-password">
                        </div>

                        <button type="submit" id="register-btn" class="auth-submit-btn">
                            <span>SUBMIT APPLICATION</span>
                            <i class="fas fa-arrow-right"></i>
                        </button>
                    </form>

                    <!-- 3. ADMIN PORTAL DIRECTIVE -->
                    <div style="margin-top: 25px; text-align: center; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 15px;">
                        <span style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 10px;">FACULTY & ADMINISTRATION</span>
                        <a href="admin/dashboard.html" style="color: #ffffff; text-decoration: none; font-size: 11px; font-weight: 700; letter-spacing: 1px; display: inline-flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, 0.05); padding: 8px 18px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); transition: all 0.3s ease;">
                            <i class="fas fa-user-shield" style="color: var(--primary-orange);"></i>
                            ADMINISTRATOR PORTAL
                        </a>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <script>
        // ==========================================
        // 1. SUPABASE INITIALIZATION
        // ==========================================
        const SUPABASE_URL = 'https://vhxdqcqbwnskhujzgtsy.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZoeGRxY3Fid25za2h1anpndHN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2ODA5NTEsImV4cCI6MjEwMTI1Njk1MX0.fZAwMZn1sXtJTXqjSf5gdOc8xoXPwm6wfa_dOKP3sJM';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Canvas & Orb Visual Effects
        const canvas = document.getElementById('particleCanvas');
        if (canvas) {
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            let particlesArray = [];

            class Particle {
                constructor() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.size = Math.random() * 2 + 0.1;
                    this.speedX = Math.random() * 0.5 - 0.25;
                    this.speedY = Math.random() * 0.5 - 0.25;
                    this.opacity = Math.random() * 0.5;
                }
                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    if (this.x > canvas.width) this.x = 0;
                    if (this.x < 0) this.x = canvas.width;
                    if (this.y > canvas.height) this.y = 0;
                    if (this.y < 0) this.y = canvas.height;
                }
                draw() {
                    ctx.fillStyle = `rgba(255, 107, 61, ${this.opacity})`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            function initParticles() {
                particlesArray = [];
                for (let i = 0; i < 100; i++) particlesArray.push(new Particle());
            }

            function animateParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particlesArray.forEach(p => { p.update(); p.draw(); });
                requestAnimationFrame(animateParticles);
            }
            initParticles();
            animateParticles();
        }

        // Helper UI Notice
        function showMessage(msg, isError = false) {
            const statusMsg = document.getElementById('status-message');
            statusMsg.innerText = msg;
            statusMsg.className = `status-msg ${isError ? 'error' : 'success'}`;
            statusMsg.style.display = 'block';
        }

        // ==========================================
        // 2. AUTHENTICATION LOGIC
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => {
            const toggleLogin = document.getElementById('toggle-login');
            const toggleRegister = document.getElementById('toggle-register');
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');

            toggleLogin.addEventListener('click', () => {
                toggleLogin.classList.add('active');
                toggleRegister.classList.remove('active');
                loginForm.classList.add('active');
                registerForm.classList.remove('active');
                document.getElementById('status-message').style.display = 'none';
            });

            toggleRegister.addEventListener('click', () => {
                toggleRegister.classList.add('active');
                toggleLogin.classList.remove('active');
                registerForm.classList.add('active');
                loginForm.classList.remove('active');
                document.getElementById('status-message').style.display = 'none';
            });

            // SIGN UP (Create auth user + profile record)
            registerForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const fullName = document.getElementById('reg-fullname').value;
                const email = document.getElementById('reg-email').value;
                const password = document.getElementById('reg-password').value;

                showMessage('Submitting application...');

                // Create account in Supabase Auth
                const { data: authData, error: authError } = await supabase.auth.signUp({
                    email: email,
                    password: password
                });

                if (authError) {
                    showMessage(authError.message, true);
                    return;
                }

                if (authData.user) {
                    // Create entry in profiles table (Triggers matric number auto-gen)
                    const { error: profileError } = await supabase
                        .from('profiles')
                        .insert([
                            { 
                                id: authData.user.id, 
                                full_name: fullName, 
                                email: email,
                                role: 'student',
                                current_class: 'foundational'
                            }
                        ]);

                    if (profileError) {
                        showMessage(profileError.message, true);
                    } else {
                        showMessage('Registration successful! Redirecting to student portal...');
                        setTimeout(() => {
                            window.location.href = 'student/dashboard.html';
                        }, 1500);
                    }
                }
            });

            // SIGN IN
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('login-email').value;
                const password = document.getElementById('login-password').value;

                showMessage('Verifying credentials...');

                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    showMessage(error.message, true);
                    return;
                }

                // Check User Role from profiles table
                const { data: profile, error: profileError } = await supabase
                    .from('profiles')
                    .select('role')
                    .eq('id', data.user.id)
                    .single();

                showMessage('Login successful! Redirecting...');
                
                setTimeout(() => {
                    if (profile && profile.role === 'admin') {
                        window.location.href = 'admin/dashboard.html';
                    } else {
                        window.location.href = 'student/dashboard.html';
                    }
                }, 1000);
            });
        });
    </script>
</body>
</html>
