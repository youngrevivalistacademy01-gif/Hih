<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Young Revivalist Academy | Portal Access</title>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Supabase JS Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- External JS with defer attribute to ensure DOM loads first -->
    <script src="auth.js" defer></script>

    <style>
        :root {
            --primary-orange: #ff6b3d;
            --orange-glow: rgba(255, 107, 61, 0.4);
            --bg-dark: #0a0a0a;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-muted: #888888;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            overflow-x: hidden;
            min-height: 100vh;
        }

        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .auth-wrapper {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            perspective: 1000px;
        }

        .auth-header {
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-weight: 900;
            font-size: 14px;
            letter-spacing: 2px;
            color: #ffffff;
            text-decoration: none;
        }

        .logo span { color: var(--primary-orange); }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s ease;
        }

        .back-link:hover { color: #ffffff; }

        .auth-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .orb-container {
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
        }

        .auth-card {
            width: 380px;
            min-height: 520px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 35px 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
        }

        .auth-toggle {
            display: flex;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 50px;
            padding: 4px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .toggle-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px 0;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .toggle-btn.active {
            background: var(--primary-orange);
            color: #ffffff;
            box-shadow: 0 0 15px var(--orange-glow);
        }

        .auth-form {
            display: none;
            flex-direction: column;
            gap: 18px;
            animation: fadeIn 0.4s ease forwards;
        }

        .auth-form.active { display: flex; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-header h2 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .form-header p {
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-bottom: 10px;
        }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 14px 14px 14px 45px;
            color: #ffffff;
            font-size: 13px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: var(--primary-orange);
            box-shadow: 0 0 10px rgba(255, 107, 61, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }

        .auth-submit-btn {
            margin-top: 10px;
            background: var(--primary-orange);
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 0 20px var(--orange-glow);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .auth-submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(255, 107, 61, 0.6);
        }

        .status-msg {
            display: none;
            padding: 10px;
            border-radius: 10px;
            font-size: 12px;
            text-align: center;
            margin-top: 10px;
        }
        .status-msg.error { background: rgba(255, 0, 0, 0.2); border: 1px solid red; color: #ff8888; }
        .status-msg.success { background: rgba(0, 255, 0, 0.2); border: 1px solid green; color: #88ff88; }
    </style>
</head>
<body>

    <canvas id="particleCanvas"></canvas>

    <div class="auth-wrapper">
        <header class="auth-header">
            <a href="index.html" class="logo">YOUNG <span>REVIVALIST</span> ACADEMY</a>
            <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Home</a>
        </header>

        <main class="auth-container">
            <div class="orb-container">
                <div class="glass-orb auth-card">
                    
                    <div class="auth-toggle">
                        <button id="toggle-login" class="toggle-btn active" type="button">Sign In</button>
                        <button id="toggle-register" class="toggle-btn" type="button">Sign Up</button>
                    </div>

                    <div id="status-message" class="status-msg"></div>

                    <!-- 1. SIGN IN FORM -->
                    <form id="login-form" class="auth-form active">
                        <div class="form-header">
                            <h2>Welcome Back</h2>
                            <p>Enter your credentials to access YRA</p>
                        </div>

                        <div class="input-group">
                            <i class="fas fa-envelope input-icon"></i>
                            <input type="email" id="login-email" placeholder="Email Address" required autocomplete="email">
                        </div>

                        <div class="input-group">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="login-password" placeholder="Password" required autocomplete="current-password">
                        </div>

                        <button type="submit" id="login-btn" class="auth-submit-btn">
                            <span>ENTER PORTAL</span>
                            <i class="fas fa-arrow-right"></i>
                        </button>
                    </form>

                    <!-- 2. SIGN UP FORM -->
                    <form id="register-form" class="auth-form">
                        <div class="form-header">
                            <h2>Join the Movement</h2>
                            <p>Apply for admission to Young Revivalist Academy</p>
                        </div>

                        <div class="input-group">
                            <i class="fas fa-user input-icon"></i>
                            <input type="text" id="reg-fullname" placeholder="Full Name" required>
                        </div>

                        <div class="input-group">
                            <i class="fas fa-envelope input-icon"></i>
                            <input type="email" id="reg-email" placeholder="Email Address" required autocomplete="email">
                        </div>

                        <div class="input-group">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="reg-password" placeholder="Password (min. 6 chars)" required autocomplete="new-password">
                        </div>

                        <button type="submit" id="register-btn" class="auth-submit-btn">
                            <span>SUBMIT APPLICATION</span>
                            <i class="fas fa-arrow-right"></i>
                        </button>
                    </form>

                    <!-- 3. ADMIN PORTAL DIRECTIVE -->
                    <div style="margin-top: 25px; text-align: center; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 15px;">
                        <span style="font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 10px;">FACULTY & ADMINISTRATION</span>
                        <a href="admin/dashboard.html" style="color: #ffffff; text-decoration: none; font-size: 11px; font-weight: 700; letter-spacing: 1px; display: inline-flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, 0.05); padding: 8px 18px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); transition: all 0.3s ease;">
                            <i class="fas fa-user-shield" style="color: var(--primary-orange);"></i>
                            ADMINISTRATOR PORTAL
                        </a>
                    </div>

                </div>
            </div>
        </main>
    </div>

</body>
</html>
