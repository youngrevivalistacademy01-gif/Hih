<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Administrator Login | Young Revivalist Academy</title>

    <link rel="stylesheet" href="admin-login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="icon" href="favicon.png" type="image/png" sizes="192x192">
    <link rel="apple-touch-icon" href="favicon.png">
</head>
<body>
    <canvas id="particleCanvas"></canvas>

    <div class="login-wrapper">
        <a href="login.html" class="back-link">
            <i class="fas fa-arrow-left"></i>
            <span>BACK</span>
        </a>

        <div class="login-panel">
            <div class="login-header">
                <div class="badge">
                    <i class="fas fa-shield-halved"></i>
                    <span>RESTRICTED ACCESS</span>
                </div>
                <div class="logo">YOUNG <span>REVIVALIST</span> ACADEMY</div>
                <h1>Administrator<br>Portal.</h1>
                <p>Authorized personnel only. All access is logged.</p>
            </div>

            <form id="adminLoginForm" class="login-form" novalidate>
                <div class="input-group">
                    <label for="adminEmail">ADMIN EMAIL</label>
                    <input type="email" id="adminEmail" name="adminEmail" required autocomplete="email" placeholder="admin@yra.org">
                    <span class="input-line"></span>
                    <span class="error-msg" id="adminEmailError"></span>
                </div>

                <div class="input-group">
                    <label for="adminPassword">ADMIN PASSWORD</label>
                    <input type="password" id="adminPassword" name="adminPassword" required autocomplete="current-password" placeholder="••••••••••">
                    <span class="input-line"></span>
                    <span class="error-msg" id="adminPasswordError"></span>
                </div>

                <div class="form-footer">
                    <span class="general-error" id="adminFormError"></span>
                    <button type="submit" class="signin-btn" id="adminSigninBtn">
                        <span class="btn-text">ACCESS PORTAL</span>
                        <span class="btn-loader"></span>
                    </button>
                </div>
            </form>

            <div class="footer-note">
                <i class="fas fa-lock"></i>
                <span>This session is monitored for security purposes.</span>
            </div>
        </div>
    </div>

    <!-- Supabase SDK must load first, then the shared client, then this page's logic -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="admin-login.js"></script>
</body>
</html>
